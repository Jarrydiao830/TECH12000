; 手环发送端：Seeed XIAO ESP32-S3（实物是否为 Sense 版待核实；本固件不使用任何板载传感器）
[platformio]
default_envs = wristband_sim

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags = -I ../common

; 不接 IMU，固件内部产生模拟数据：先单独验证 ESP-NOW -> 接收板 -> 电脑 这条链路
[env:wristband_sim]
build_flags = ${env.build_flags} -D IMU_SIM

; 接真实 IMU：需要先在 src/board_config.h 填引脚/波特率，并实现 src/imu_yahboom.cpp
[env:wristband]
