; 固定端接收板：ESP32-S3-DevKitC-1 类开发板（N16R8）
; 该类板子通常有两个 Type-C 口（USB转串口 / 芯片原生USB），丝印与连接以实物为准。
; 默认 Serial 走 USB转串口芯片那一路；若要改用原生 USB CDC，加：
;   build_flags = ${env.build_flags} -D ARDUINO_USB_CDC_ON_BOOT=1
[env:receiver]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
build_flags = -I ../common
