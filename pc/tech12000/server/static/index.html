<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TECH12000 监控台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#12151a; --card:#1b2028; --line:#2b323d; --fg:#e6e9ee; --dim:#8b94a3;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header h1 { font-size:16px; margin:0; flex:1; }
  #conn { font-size:12px; color:var(--dim); }
  main { display:grid; grid-template-columns:repeat(12,1fr); gap:12px; padding:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
  .card h2 { font-size:12px; color:var(--dim); margin:0 0 8px; font-weight:600; letter-spacing:.04em; }
  .c4 { grid-column:span 4; } .c6 { grid-column:span 6; } .c8 { grid-column:span 8; } .c12 { grid-column:span 12; }
  @media (max-width:1000px) { .c4,.c6,.c8 { grid-column:span 12; } }
  #state { font-size:28px; font-weight:700; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; border:1px solid var(--line); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .info { color:var(--info); } .dim { color:var(--dim); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td,th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  button { background:#2a313c; color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { background:#343c49; } button:disabled { opacity:.4; cursor:not-allowed; }
  button.danger { border-color:var(--bad); color:var(--bad); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  canvas { width:100%; height:150px; display:block; background:#141820; border-radius:6px; }
  #banner { display:none; grid-column:span 12; padding:12px; border-radius:8px; background:#3d1418;
            border:1px solid var(--bad); font-weight:600; }
  #msg { color:var(--warn); min-height:1.5em; }
  #qr svg { background:#fff; border-radius:6px; max-width:200px; height:auto; }
  code { background:#141820; padding:1px 5px; border-radius:4px; word-break:break-all; }
  small { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>TECH12000 浴室跌倒检测原型 · 监控台</h1>
  <span id="sim" class="pill warn" style="display:none">模拟数据</span>
  <span id="conn">连接中…</span>
</header>
<main>
  <div id="banner"></div>

  <div class="card c4">
    <h2>系统状态</h2>
    <div id="state">—</div>
    <div id="reason" class="dim"></div>
    <p>执行模式：<b id="mode">—</b>　监测：<b id="monitoring">—</b></p>
    <p>部署指令：<b id="deploy">—</b><br>
       实际展开状态：<b id="outcome">—</b><br>
       <small>本系统没有气囊压力/展开到位反馈，"指令已发送"不等于"已展开"。</small></p>
    <p class="dim">更新时间 <span id="time">—</span> · 配置 <span id="cfgv">—</span></p>
  </div>

  <div class="card c8">
    <h2>设备</h2>
    <table id="devices"><thead><tr><th>设备</th><th>连接</th><th>数据</th><th>延迟/丢包</th><th>说明</th></tr></thead><tbody></tbody></table>
    <p class="dim" id="features"></p>
  </div>

  <div class="card c12">
    <h2>控制（仅本机）</h2>
    <div class="row">
      <button onclick="post('/api/monitoring',{on:true})">开始监测</button>
      <button onclick="post('/api/monitoring',{on:false})">停止监测</button>
      <button onclick="post('/api/reset',{})">复位</button>
      <span class="dim">|</span>
      <button onclick="post('/api/mode',{mode:'monitor'})">MONITOR 仅监测</button>
      <button onclick="post('/api/mode',{mode:'demo'})">DEMO 演示</button>
      <button class="danger" onclick="arm()">ARMED 实际执行使能</button>
    </div>
    <div class="row" id="simrow" style="display:none">
      <span class="dim">模拟剧本：</span>
      <button onclick="post('/api/sim/inject',{kind:'fall'})">跌倒</button>
      <button onclick="post('/api/sim/inject',{kind:'wave'})">挥手（仅手腕）</button>
      <button onclick="post('/api/sim/inject',{kind:'squat'})">慢蹲</button>
      <button onclick="post('/api/sim/inject',{kind:'idle'})">静止</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card c6"><h2>合加速度 |a| (m/s²) 与三轴</h2><canvas id="cAcc"></canvas></div>
  <div class="card c6"><h2>合角速度 |ω| (°/s) 与三轴</h2><canvas id="cGyr"></canvas></div>

  <div class="card c4">
    <h2>雷达目标</h2>
    <div id="radar" class="dim">无数据</div>
    <small>只显示固件实际输出的字段。坐标定义待 SDK 文档确认。</small>
  </div>

  <div class="card c4">
    <h2>最近事件</h2>
    <table id="events"><tbody></tbody></table>
  </div>

  <div class="card c4">
    <h2>手机配对</h2>
    <div id="qr"></div>
    <p>地址 <code id="paddr"></code><br>令牌 <code id="ptok"></code></p>
    <button onclick="rotate()">更换令牌（旧手机失效）</button>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const STATE = { initializing:['初始化','info'], ready:['Ready 监测中','ok'], suspected_fall:['疑似异常','warn'],
                triggered:['已触发（锁定）','bad'], fault:['故障','bad'] };
const DEPLOY = { none:'无', not_sent_monitor_mode:'未发送（仅监测模式）', demo_command_sent:'演示指令已发送',
                 command_sent:'触发指令已发送', controller_acked:'控制器确认接收', send_failed:'发送失败',
                 skipped_duplicate:'重复事件，已跳过' };
const NAMES = { wristband:'手环', radar:'雷达', receiver:'接收板', servo:'舵机控制器' };
const acc = [], gyr = [], MAXP = 600;

function fmtT(t) { return t ? new Date(t*1000).toLocaleTimeString() : '—'; }
function setMsg(t) { $('msg').textContent = t || ''; }

async function post(url, body) {
  setMsg('');
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (!r.ok) { const j = await r.json().catch(()=>({})); setMsg(j.detail || ('请求失败 ' + r.status)); }
  return r;
}
function arm() {
  const v = prompt('即将允许【实际释放】。\n确认释放机构、气瓶、人员位置均已检查。\n输入 ARM 确认：');
  if (v !== null) post('/api/mode', {mode:'armed', confirm:v});
}
async function loadPairing(method) {
  const r = await fetch('/api/pairing' + (method ? '/rotate' : ''), {method: method || 'GET'});
  const p = await r.json();
  $('qr').innerHTML = p.qr_svg;      // 来自本机服务生成的 SVG
  $('paddr').textContent = p.host + ':' + p.port;
  $('ptok').textContent = p.token;
}
function rotate() { if (confirm('更换后已配对的手机需要重新配对，继续？')) loadPairing('POST'); }

function td(tr, text, cls) { const c = tr.insertCell(); c.textContent = text; if (cls) c.className = cls; }

function render(s) {
  const [label, cls] = STATE[s.state] || [s.state, ''];
  $('state').textContent = label; $('state').className = cls;
  $('reason').textContent = s.state_reason || '';
  $('mode').textContent = s.mode.toUpperCase();
  $('mode').className = s.mode === 'armed' ? 'bad' : s.mode === 'demo' ? 'warn' : '';
  $('monitoring').textContent = s.monitoring ? '运行' : '已停止';
  $('deploy').textContent = DEPLOY[s.deploy_status] || s.deploy_status;
  $('outcome').textContent = s.last_event ? '未知 / 待现场检查' : '—';
  $('time').textContent = fmtT(s.server_time);
  $('cfgv').textContent = s.config_version;
  $('sim').style.display = s.simulated_input ? '' : 'none';
  const b = $('banner');
  if (s.state === 'triggered' && s.last_event) { b.style.display = 'block'; b.textContent = s.last_event.message + '（复位前保持锁定）'; }
  else b.style.display = 'none';

  const tb = $('devices').tBodies[0]; tb.textContent = '';
  for (const [k, d] of Object.entries(s.devices)) {
    const tr = tb.insertRow();
    td(tr, (NAMES[k] || k) + (d.simulated ? '（模拟）' : ''));
    td(tr, d.connected ? '已连接' : '未连接', d.connected ? 'ok' : 'bad');
    if ('fresh' in d) td(tr, d.fresh ? ('实时 · ' + (d.age_s ?? '—') + 's前') : (d.last_rx_wall ? '过期 · 最后 ' + fmtT(d.last_rx_wall) : '无数据'), d.fresh ? 'ok' : 'bad');
    else if ('heartbeat_age_s' in d) td(tr, d.heartbeat_age_s == null ? '无上报' : '上报 ' + d.heartbeat_age_s + 's前');
    else td(tr, '—', 'dim');
    let q = '';
    if ('lost' in d) q = '丢 ' + d.lost + (d.loss_rate != null ? ' (' + (d.loss_rate*100).toFixed(1) + '%)' : '') + ' · 重复 ' + d.duplicates;
    if (k === 'wristband' && s.wrist_extra_latency_ms != null) q += ' · 额外延迟 ' + s.wrist_extra_latency_ms + 'ms';
    td(tr, q || '—', 'dim');
    td(tr, d.detail || '', 'dim');
  }
  const f = s.features;
  $('features').textContent = '特征：|a|=' + (f.wrist.accel_mag ?? '—') + '  |ω|=' + (f.wrist.gyro_mag ?? '—') +
    '  雷达高度=' + (f.radar.height ?? '—') + '  窗口内下降=' + (f.radar.height_drop ?? '—') +
    (f.radar.has_height ? '' : '  （雷达尚未给出目标高度）');
}

function renderRadar(r) {
  const el = $('radar');
  if (!r) { el.textContent = '无实时数据'; return; }
  el.textContent = r.targets.length ? r.targets.map((t, i) =>
    '目标' + (i+1) + ': x=' + fx(t.x) + ' y=' + fx(t.y) + ' z=' + fx(t.z)).join('\n') : '当前无目标';
  el.style.whiteSpace = 'pre';
  if (r.n_points != null) el.textContent += '\n点云点数: ' + r.n_points;
}
const fx = v => v == null ? '—' : v.toFixed(2);

async function loadEvents() {
  const r = await fetch('/api/events?limit=8'); const j = await r.json();
  const tb = $('events').tBodies[0]; tb.textContent = '';
  if (!j.events.length) { td(tb.insertRow(), '暂无事件', 'dim'); return; }
  for (const e of j.events) {
    const tr = tb.insertRow();
    td(tr, new Date(e.t_wall*1000).toLocaleString());
    td(tr, (e.is_test ? '[测试] ' : '') + (DEPLOY[e.deploy_status] || e.deploy_status), e.is_test ? 'warn' : 'bad');
  }
}

function plot(canvas, data, colors) {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w*dpr) { canvas.width = w*dpr; canvas.height = h*dpr; }
  const g = canvas.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  if (data.length < 2) return;
  let lo = Infinity, hi = -Infinity;
  for (const p of data) for (const v of p) { if (v < lo) lo = v; if (v > hi) hi = v; }
  if (hi - lo < 1) { hi += .5; lo -= .5; }
  const y = v => h - 4 - (v - lo) / (hi - lo) * (h - 8), x = i => i / (MAXP - 1) * w;
  g.fillStyle = '#8b94a3'; g.font = '10px sans-serif';
  g.fillText(hi.toFixed(1), 4, 10); g.fillText(lo.toFixed(1), 4, h - 2);
  for (let c = data[0].length - 1; c >= 0; c--) {
    g.strokeStyle = colors[c]; g.lineWidth = c === 0 ? 1.8 : 0.8; g.beginPath();
    data.forEach((p, i) => i ? g.lineTo(x(i), y(p[c])) : g.moveTo(x(i), y(p[c])));
    g.stroke();
  }
}
function pushImu(rows) {
  for (const r of rows) {
    const [, ax, ay, az, gx, gy, gz] = r;
    acc.push([Math.hypot(ax, ay, az), ax, ay, az]); gyr.push([Math.hypot(gx, gy, gz), gx, gy, gz]);
  }
  while (acc.length > MAXP) acc.shift(); while (gyr.length > MAXP) gyr.shift();
  const col = ['#e6e9ee', '#f8514988', '#3fb95088', '#58a6ff88'];
  plot($('cAcc'), acc, col); plot($('cGyr'), gyr, col);
}

function connect() {
  const ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onopen = () => { $('conn').textContent = '已连接'; loadEvents(); };
  ws.onclose = () => { $('conn').textContent = '与本机服务断开，重连中…'; $('state').textContent = '界面离线'; $('state').className = 'bad'; setTimeout(connect, 1000); };
  ws.onmessage = m => {
    const d = JSON.parse(m.data);
    if (d.type === 'tick') { render(d.status); pushImu(d.imu); renderRadar(d.radar); }
    else if (d.type === 'event') loadEvents();
  };
}
fetch('/api/status').then(r => r.json()).then(s => {
  if (s.devices.wristband.detail === '模拟数据' || s.devices.radar.detail === '模拟数据') $('simrow').style.display = '';
});
loadPairing(); connect();
</script>
</body>
</html>
