[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tech12000"
version = "0.1.0"
description = "TECH12000 浴室跌倒检测与气囊触发研究原型 - 电脑端"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6",
  "pyserial>=3.5",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tech12000 = "tech12000.main:main"

[tool.setuptools.packages.find]
where = ["pc"]

[tool.setuptools.package-data]
tech12000 = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
